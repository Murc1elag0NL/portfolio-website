<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bjorn van Es</title>
  
  <!-- Single clean, modern typeface -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            pureBlack: '#000000',
            pureWhite: '#ffffff',
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #ffffff;
      color: #000000;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Subtle crossfade for hero image transitions */
    #mainPhoto {
      transition: opacity 180ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Hide scrollbar cleanly when lightbox is active */
    body.lightbox-open {
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-pureWhite text-pureBlack selection:bg-pureBlack selection:text-pureWhite">

  <!-- MINIMALIST CENTERED HEADER -->
  <header class="pt-12 pb-6 px-6 md:px-12">
    <div class="max-w-5xl mx-auto text-center">
      <h1 class="text-2xl sm:text-3xl md:text-4xl font-semibold tracking-[0.18em] uppercase text-pureBlack">
        Bjorn van Es
      </h1>
    </div>
  </header>

  <!-- MUSEUM-GRADE HERO SHOWCASE & 50-THUMBNAIL CONTACT SHEET -->
  <main class="max-w-5xl mx-auto px-6 md:px-12 pt-4 pb-20 space-y-12 md:space-y-16">
    
    <!-- FIXED-HEIGHT HERO DISPLAY (Zero layout shift between landscape & portrait) -->
    <section aria-label="Featured photograph" class="flex flex-col items-center">
      <div 
        id="heroStage"
        role="button"
        tabindex="0"
        aria-label="Open photograph in fullscreen view"
        class="group relative w-full h-[52vh] sm:h-[58vh] md:h-[65vh] flex items-center justify-center bg-pureWhite cursor-zoom-in focus:outline-none"
      >
        <img 
          id="mainPhoto"
          src="" 
          alt="" 
          class="max-h-full max-w-full w-auto h-auto object-contain block select-none opacity-100"
        />
      </div>

      <!-- CLEAN GALLERY METADATA BAR -->
      <div class="w-full pt-5 mt-3 flex justify-between items-baseline">
        <p id="mainTitle" class="text-[11px] sm:text-xs uppercase tracking-[0.16em] text-neutral-800 font-medium">
          <!-- Active photo title -->
        </p>
        <span id="photoCounter" class="text-[11px] sm:text-xs uppercase tracking-[0.16em] text-neutral-400 font-normal tabular-nums">
          01 / 50
        </span>
      </div>
    </section>

    <!-- 50-PHOTO CONTACT-SHEET GRID (Monochrome & dimmed until active/hovered) -->
    <section aria-label="Photograph contact sheet">
      <div 
        id="thumbnailGrid" 
        class="grid grid-cols-5 md:grid-cols-10 gap-2 sm:gap-2.5 md:gap-3"
      >
        <!-- 50 thumbnails dynamically generated -->
      </div>
    </section>

  </main>

  <!-- QUIET EDITORIAL FOOTER -->
  <footer class="py-12 px-6 md:px-12">
    <div class="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2 text-[11px] uppercase tracking-[0.16em] text-neutral-400 font-normal">
      <span>Bjorn van Es</span>
      <span>&copy; All rights reserved</span>
    </div>
  </footer>

  <!-- FULLSCREEN PURE-WHITE LIGHTBOX MODAL -->
  <div 
    id="lightboxModal" 
    role="dialog" 
    aria-modal="true" 
    aria-label="Fullscreen photograph view"
    class="fixed inset-0 z-50 hidden bg-pureWhite flex items-center justify-center p-4 sm:p-8 md:p-12 cursor-zoom-out select-none"
  >
    <img 
      id="lightboxPhoto" 
      src="" 
      alt="" 
      class="max-h-full max-w-full w-auto h-auto object-contain block"
    />
  </div>

  <!-- SCRIPT & DATA -->

      { src: 'https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&w=1800&q=85', title: 'Driftwood Cove' },
      { src: 'https://images.unsplash.com/photo-1519904981063-b0cf448d479e?auto=format&fit=crop&w=1800&q=85', title: 'Summit Ascent' },
      { src: 'https://images.unsplash.com/photo-1504608524841-42fe6f032b4b?auto=format&fit=crop&w=1800&q=85', title: 'Storm Front' },
      { src: 'https://images.unsplash.com/photo-1494500764479-0c8f2919a3d8?auto=format&fit=crop&w=1800&q=85', title: 'Mirror Lake' },
      { src: 'https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=1200&q=85', title: 'Gallery Frame' },
      { src: 'https://images.unsplash.com/photo-1482192505345-5655af888cc4?auto=format&fit=crop&w=1800&q=85', title: 'Winter Cabin' },
      { src: 'https://images.unsplash.com/photo-1508193638397-1c4234db14d8?auto=format&fit=crop&w=1800&q=85', title: 'Amber Woodland' },
      { src: 'https://images.unsplash.com/photo-1495567720989-cebdbdd97913?auto=format&fit=crop&w=1800&q=85', title: 'Evening Glow' },
      { src: 'https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1800&q=85', title: 'Morning Pasture' },
      { src: 'https://images.unsplash.com/photo-1483728642387-6c3bdd6c93e5?auto=format&fit=crop&w=1800&q=85', title: 'Snowline Crest' },
      { src: 'https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?auto=format&fit=crop&w=1800&q=85', title: 'Night Camp' },
      { src: 'https://images.unsplash.com/photo-1439853949127-fa647821eba0?auto=format&fit=crop&w=1200&q=85', title: 'Valley Falls' },
      { src: 'https://images.unsplash.com/photo-1465056836041-7f43ac27dcb5?auto=format&fit=crop&w=1800&q=85', title: 'Blue Hour Peaks' }
    ];

    let activeIndex = 0;
    let isLightboxOpen = false;
    let swapTimeout = null;
    let touchStartX = 0;
    let touchStartY = 0;
    const preloadedCache = new Set();

    /**
     * Parses window.location.hash (e.g. #1 to #50) and returns a valid 0-based photo index.
     */
    function getIndexFromHash() {
      const rawHash = window.location.hash.replace('#', '').trim();
      const parsedNumber = parseInt(rawHash, 10);
      if (!isNaN(parsedNumber) && parsedNumber >= 1 && parsedNumber <= photos.length) {
        return parsedNumber - 1;
      }
      return 0;
    }

    /**
     * Updates the URL hash cleanly (e.g. #23) without cluttering browser back-button history.
     */
    function syncUrlHash(index) {
      const targetHash = `#${index + 1}`;
      if (window.location.hash !== targetHash && window.history && window.history.replaceState) {
        window.history.replaceState(null, '', targetHash);
      }
    }

    /**
     * Preloads high-resolution images in the background so browsing feels instantaneous.
     */
    function preloadImage(index) {
      const normalizedIndex = (index + photos.length) % photos.length;
      if (preloadedCache.has(normalizedIndex)) return;
      preloadedCache.add(normalizedIndex);

      const img = new Image();
      img.src = photos[normalizedIndex].src;
    }

    /**
     * Updates the featured hero display, metadata, lightbox, URL hash, and active thumbnail state.
     */
    function selectPhoto(index, immediate = false) {
      const normalizedIndex = (index + photos.length) % photos.length;
      activeIndex = normalizedIndex;
      const photo = photos[normalizedIndex];

      const mainPhoto = document.getElementById('mainPhoto');
      const mainTitle = document.getElementById('mainTitle');
      const counter = document.getElementById('photoCounter');
      const lightboxPhoto = document.getElementById('lightboxPhoto');

      if (!mainPhoto || !mainTitle || !counter || !lightboxPhoto) return;

      if (swapTimeout) {
        clearTimeout(swapTimeout);
        swapTimeout = null;
      }

      if (immediate) {
        mainPhoto.src = photo.src;
        mainPhoto.alt = photo.title;
        mainPhoto.style.opacity = '1';
      } else {
        mainPhoto.style.opacity = '0.2';
        swapTimeout = setTimeout(() => {
          mainPhoto.src = photo.src;
          mainPhoto.alt = photo.title;
          mainPhoto.style.opacity = '1';
        }, 90);
      }

      // Synchronize fullscreen lightbox image
      lightboxPhoto.src = photo.src;
      lightboxPhoto.alt = photo.title;

      // Update title and tabular counter
      mainTitle.textContent = photo.title;
      const formattedIndex = String(normalizedIndex + 1).padStart(2, '0');
      const formattedTotal = String(photos.length).padStart(2, '0');
      counter.textContent = `${formattedIndex} / ${formattedTotal}`;

      // Keep shareable direct URL hash synchronized
      syncUrlHash(normalizedIndex);

      // Update thumbnail states: monochrome & dimmed when inactive, crisp full-color when active
      const buttons = document.querySelectorAll('#thumbnailGrid button');
      buttons.forEach((btn, idx) => {
        const img = btn.querySelector('img');
        if (idx === normalizedIndex) {
          btn.setAttribute('aria-current', 'true');
          btn.classList.add('ring-1', 'ring-pureBlack', 'ring-offset-2');
          if (img) {
            img.classList.remove('grayscale', 'opacity-55');
            img.classList.add('grayscale-0', 'opacity-100');
          }
        } else {
          btn.removeAttribute('aria-current');
          btn.classList.remove('ring-1', 'ring-pureBlack', 'ring-offset-2');
          if (img) {
            img.classList.add('grayscale', 'opacity-55');
            img.classList.remove('grayscale-0', 'opacity-100');
          }
        }
      });

      // Preload adjacent photos for zero-lag browsing
      preloadImage(normalizedIndex + 1);
      preloadImage(normalizedIndex - 1);
    }

    /**
     * Opens the fullscreen pure-white lightbox modal.
     */
    function openLightbox() {
      const lightboxModal = document.getElementById('lightboxModal');
      if (!lightboxModal) return;
      isLightboxOpen = true;
      lightboxModal.classList.remove('hidden');
      document.body.classList.add('lightbox-open');
    }

    /**
     * Closes the fullscreen pure-white lightbox modal.
     */
    function closeLightbox() {
      const lightboxModal = document.getElementById('lightboxModal');
      if (!lightboxModal) return;
      isLightboxOpen = false;
      lightboxModal.classList.add('hidden');
      document.body.classList.remove('lightbox-open');
    }

    /**
     * Binds horizontal touch swipe gestures to an element for mobile & tablet navigation.
     */
    function attachSwipeNavigation(element) {
      if (!element) return;

      element.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      element.addEventListener('touchend', (e) => {
        if (e.changedTouches.length !== 1) return;
        const deltaX = e.changedTouches[0].clientX - touchStartX;
        const deltaY = e.changedTouches[0].clientY - touchStartY;

        // Trigger only on intentional horizontal swipes (ignore vertical page scrolling)
        if (Math.abs(deltaX) > 45 && Math.abs(deltaX) > Math.abs(deltaY) * 1.2) {
          if (deltaX < 0) {
            selectPhoto((activeIndex + 1) % photos.length);
          } else {
            selectPhoto((activeIndex - 1 + photos.length) % photos.length);
          }
        }
      }, { passive: true });
    }

    /**
     * Builds the 50-thumbnail contact-sheet grid and binds hover, touch, click, and keyboard controls.
     */
    function initGallery() {
      const grid = document.getElementById('thumbnailGrid');
      const heroStage = document.getElementById('heroStage');
      const lightboxModal = document.getElementById('lightboxModal');

      if (!grid || !heroStage || !lightboxModal) return;

      grid.innerHTML = '';

      photos.forEach((photo, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.setAttribute('aria-label', `Select photograph ${index + 1}: ${photo.title}`);
        button.className = 'group relative aspect-square w-full overflow-hidden bg-neutral-100 focus:outline-none focus:ring-1 focus:ring-pureBlack focus:ring-offset-2 transition-all duration-200';

        const img = document.createElement('img');
        img.src = photo.src;
        img.alt = photo.title;
        img.loading = index < 20 ? 'eager' : 'lazy';
        img.className = 'w-full h-full object-cover grayscale opacity-55 group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-200 pointer-events-none';

        button.appendChild(img);

        // Hover on desktop swaps immediately; click/tap selects on all devices
        button.addEventListener('mouseenter', () => {
          if (activeIndex !== index) {
            selectPhoto(index);
          }
        });

        button.addEventListener('click', () => {
          if (activeIndex !== index) {
            selectPhoto(index);
          }
        });

        button.addEventListener('focus', () => {
          if (activeIndex !== index) {
            selectPhoto(index);
          }
        });

        grid.appendChild(button);
      });

      // Open fullscreen lightbox when clicking or pressing Enter/Space on the hero stage
      heroStage.addEventListener('click', openLightbox);
      heroStage.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openLightbox();
        }
      });

      // Click anywhere in the lightbox to close
      lightboxModal.addEventListener('click', closeLightbox);

      // Enable touch swipe left/right on both the main stage and fullscreen lightbox
      attachSwipeNavigation(heroStage);
      attachSwipeNavigation(lightboxModal);

      // Global keyboard navigation (Left/Right arrows & Escape)
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          selectPhoto((activeIndex + 1) % photos.length);
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          selectPhoto((activeIndex - 1 + photos.length) % photos.length);
        } else if (e.key === 'Escape' && isLightboxOpen) {
          closeLightbox();
        }
      });

      // Respond if the user manually edits or navigates via a URL hash (e.g. #14)
      window.addEventListener('hashchange', () => {
        const hashIndex = getIndexFromHash();
        if (hashIndex !== activeIndex) {
          selectPhoto(hashIndex, true);
        }
      });

      // Initialize from URL hash if present (e.g. bjornvanes.nl/#23), otherwise photo 1
      selectPhoto(getIndexFromHash(), true);
    }

    window.onload = initGallery;
  </script>
</body>
</html>
