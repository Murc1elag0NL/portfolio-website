<!DOCTYPE html>
<html lang="nl" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bjorn van Es</title>

  <!-- Single clean, modern typeface -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            pureBlack: '#000000',
            pureWhite: '#ffffff',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #ffffff;
      color: #000000;
      -webkit-font-smoothing: antialiased;
    }

    #heroImage {
      transition: opacity 160ms ease-in-out;
    }

    .thumb-btn img {
      transition: filter 200ms ease, opacity 200ms ease, transform 250ms ease;
    }

    .thumb-btn:hover img,
    .thumb-btn.is-active img {
      filter: grayscale(0%);
      opacity: 1;
    }

    .thumb-btn:not(.is-active) img {
      filter: grayscale(100%);
      opacity: 0.55;
    }

    .thumb-btn:not(.is-active):hover img {
      filter: grayscale(0%);
      opacity: 1;
    }
  </style>
</head>
<body class="bg-pureWhite text-pureBlack selection:bg-pureBlack selection:text-pureWhite min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="pt-10 pb-6 px-6 md:px-12">
    <div class="max-w-6xl mx-auto text-center">
      <h1 class="text-2xl md:text-4xl font-bold tracking-tight uppercase">
        Bjorn van Es
      </h1>
    </div>
  </header>

  <!-- HOOFDPODIUM & 54-FOTO CONTACTSHEET -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-6 md:px-12 pb-16 flex flex-col justify-between gap-10">

    <!-- GROTE HERO WEERGAVE (Vaste podiumhoogte) -->
    <section aria-label="Geselecteerde foto" class="w-full flex flex-col items-center">
      <div
        id="heroStage"
        class="w-full h-[54vh] md:h-[64vh] flex items-center justify-center bg-pureWhite cursor-zoom-in select-none touch-pan-y"
        title="Klik voor volledig scherm"
      >
        <img
          id="heroImage"
          src="fotos/01.jpg"
          alt="Bjorn van Es - 01"
          class="max-h-full max-w-full w-auto h-auto object-contain"
        />
      </div>

      <!-- SUBTIELE TITEL & TELLER -->
      <div class="w-full max-w-3xl flex items-center justify-between pt-4 px-1 text-xs uppercase tracking-widest text-neutral-500 font-medium">
        <span id="heroTitle" class="truncate pr-4"></span>
        <span id="heroCounter" class="tabular-nums shrink-0 text-neutral-400">01 / 54</span>
      </div>
    </section>

    <!-- 54 MINIATUREN (Rijen van 10 op desktop, laatste rij gecentreerd) -->
    <section aria-label="Fotoselectie" class="w-full pt-2">
      <div
        id="thumbnailGrid"
        class="flex flex-wrap justify-center gap-2 md:gap-2.5"
      >
        <!-- Dynamisch gevuld vanuit het script -->
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="py-8 px-6 md:px-12">
    <div class="max-w-6xl mx-auto flex justify-between items-center text-[11px] uppercase tracking-widest text-neutral-400 font-medium">
      <span>Bjorn van Es</span>
      <span>&copy; All rights reserved</span>
    </div>
  </footer>

  <!-- FULLSCREEN LIGHTBOX -->
  <div
    id="lightbox"
    class="fixed inset-0 z-50 bg-pureWhite hidden items-center justify-center p-4 md:p-10 cursor-zoom-out select-none touch-pan-y"
    aria-hidden="true"
  >
    <img
      id="lightboxImage"
      src=""
      alt="Volledig scherm"
      class="max-h-full max-w-full w-auto h-auto object-contain"
    />
  </div>

  <!-- SCRIPT -->
  <script>
    // ==========================================
    // AUTOMATISCHE LIJST: fotos/01.jpg t/m fotos/54.jpg
    // ==========================================
    const TOTAL_PHOTOS = 54;

    const customTitles = {
      // Optioneel per foto een titel toevoegen, bijvoorbeeld:
      // 1: 'Kustlijn',
      // 26: 'McLaren',
      // 54: 'Bloedmaan'
    };

    const photos = Array.from({ length: TOTAL_PHOTOS }, (_, i) => {
      const num = String(i + 1).padStart(2, '0');
      return {
        src: `fotos/${num}.jpg`,
        title: customTitles[i + 1] || ''
      };
    });

    let currentIndex = 0;
    const preloadedCache = new Set();

    const heroStage = document.getElementById('heroStage');
    const heroImage = document.getElementById('heroImage');
    const heroTitle = document.getElementById('heroTitle');
    const heroCounter = document.getElementById('heroCounter');
    const thumbnailGrid = document.getElementById('thumbnailGrid');
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');

    function preloadImage(index) {
      const wrappedIndex = (index + photos.length) % photos.length;
      const src = photos[wrappedIndex].src;
      if (!preloadedCache.has(src)) {
        const img = new Image();
        img.src = src;
        preloadedCache.add(src);
      }
    }

    function updateUrlHash(index) {
      const targetHash = `#${index + 1}`;
      if (window.location.hash !== targetHash) {
        history.replaceState(null, '', targetHash);
      }
    }

    function selectPhoto(index, updateHash = true) {
      const wrappedIndex = (index + photos.length) % photos.length;
      if (wrappedIndex === currentIndex && heroImage.dataset.loaded === 'true') {
        return;
      }

      currentIndex = wrappedIndex;
      const photo = photos[currentIndex];
      const formattedNum = String(currentIndex + 1).padStart(2, '0');

      // Zachte crossfade op het hoofdpodium
      heroImage.style.opacity = '0.15';

      setTimeout(() => {
        heroImage.src = photo.src;
        heroImage.alt = photo.title || `Bjorn van Es - ${formattedNum}`;
        heroImage.dataset.loaded = 'true';
        heroTitle.textContent = photo.title || '';
        heroCounter.textContent = `${formattedNum} / ${String(photos.length).padStart(2, '0')}`;

        if (!lightbox.classList.contains('hidden')) {
          lightboxImage.src = photo.src;
        }

        requestAnimationFrame(() => {
          heroImage.style.opacity = '1';
        });
      }, 90);

      // Update actieve thumbnail
      const buttons = thumbnailGrid.querySelectorAll('.thumb-btn');
      buttons.forEach((btn, idx) => {
        if (idx === currentIndex) {
          btn.classList.add('is-active', 'ring-1', 'ring-black', 'ring-offset-2');
          btn.setAttribute('aria-current', 'true');
        } else {
          btn.classList.remove('is-active', 'ring-1', 'ring-black', 'ring-offset-2');
          btn.removeAttribute('aria-current');
        }
      });

      if (updateHash) {
        updateUrlHash(currentIndex);
      }

      // Preload naastgelegen beelden voor directe overgangen
      preloadImage(currentIndex + 1);
      preloadImage(currentIndex - 1);
    }

    function openLightbox() {
      lightboxImage.src = photos[currentIndex].src;
      lightbox.classList.remove('hidden');
      lightbox.classList.add('flex');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.add('hidden');
      lightbox.classList.remove('flex');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    function attachSwipeNavigation(element) {
      let touchStartX = 0;
      let touchStartY = 0;

      element.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      element.addEventListener('touchend', (e) => {
        const deltaX = e.changedTouches[0].screenX - touchStartX;
        const deltaY = e.changedTouches[0].screenY - touchStartY;

        if (Math.abs(deltaX) > 45 && Math.abs(deltaX) > Math.abs(deltaY)) {
          if (deltaX < 0) {
            selectPhoto(currentIndex + 1);
          } else {
            selectPhoto(currentIndex - 1);
          }
        }
      }, { passive: true });
    }

    function initGallery() {
      photos.forEach((photo, index) => {
        const num = String(index + 1).padStart(2, '0');
        const btn = document.createElement('button');
        btn.type = 'button';
        // 5 per rij op mobiel, 6 op tablet, exact 10 per rij op desktop (met gecentreerde laatste rij)
        btn.className = 'thumb-btn aspect-[4/3] w-[calc(20%-0.4rem)] sm:w-[calc(16.666%-0.521rem)] lg:w-[calc(10%-0.5625rem)] overflow-hidden bg-neutral-100 focus:outline-none cursor-pointer';
        btn.setAttribute('aria-label', photo.title ? `${num}: ${photo.title}` : `Foto ${num}`);

        btn.innerHTML = `
          <img
            src="${photo.src}"
            alt="${photo.title || `Foto ${num}`}"
            loading="${index < 20 ? 'eager' : 'lazy'}"
            class="w-full h-full object-cover"
          />
        `;

        btn.addEventListener('mouseenter', () => selectPhoto(index));
        btn.addEventListener('focus', () => selectPhoto(index));
        btn.addEventListener('click', () => selectPhoto(index));

        thumbnailGrid.appendChild(btn);
      });

      // Start op URL-hash indien meegegeven (bijv. #26), anders op foto 1
      const hashNumber = parseInt(window.location.hash.replace('#', ''), 10);
      const initialIndex = (!isNaN(hashNumber) && hashNumber >= 1 && hashNumber <= photos.length)
        ? hashNumber - 1
        : 0;

      selectPhoto(initialIndex, false);

      // Lightbox & Touch-swipes
      heroStage.addEventListener('click', openLightbox);
      lightbox.addEventListener('click', closeLightbox);
      attachSwipeNavigation(heroStage);
      attachSwipeNavigation(lightbox);

      // Toetsenbordnavigatie
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          selectPhoto(currentIndex + 1);
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          selectPhoto(currentIndex - 1);
        } else if (e.key === 'Escape' && !lightbox.classList.contains('hidden')) {
          closeLightbox();
        }
      });

      // Luister naar handmatige wijziging in URL-hash
      window.addEventListener('hashchange', () => {
        const num = parseInt(window.location.hash.replace('#', ''), 10);
        if (!isNaN(num) && num >= 1 && num <= photos.length) {
          selectPhoto(num - 1, false);
        }
      });
    }

    window.addEventListener('DOMContentLoaded', initGallery);
  </script>
</body>
</html>
