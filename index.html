<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bjorn van Es — Photography</title>
  
  <!-- Single clean, modern typeface -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            pureBlack: '#000000',
            pureWhite: '#ffffff',
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #ffffff;
      color: #000000;
      -webkit-font-smoothing: antialiased;
    }
    
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-pureWhite text-pureBlack selection:bg-pureBlack selection:text-pureWhite">

  <!-- HEADER -->
  <header class="pt-12 pb-8 px-6 md:px-12 border-b border-black">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row md:items-baseline md:justify-between gap-2">
      <h1 class="text-3xl md:text-5xl font-bold tracking-tight uppercase">
        Bjorn van Es
      </h1>
      <span class="text-xs uppercase tracking-widest text-neutral-500 font-medium">
        Photography
      </span>
    </div>
  </header>

  <!-- COLOR NAVIGATION (Sticky & Centered) -->
  <nav class="sticky top-0 z-40 bg-pureWhite/95 backdrop-blur-sm border-b border-black px-6 md:px-12">
    <div class="max-w-6xl mx-auto flex items-center justify-center gap-6 md:gap-8 overflow-x-auto no-scrollbar py-4" id="categoryNav">
      <!-- Dynamisch gevuld in het midden -->
    </div>
  </nav>

  <!-- CAROUSELS PER COLOR -->
  <main class="max-w-6xl mx-auto px-6 md:px-12 py-12 space-y-24" id="portfolioContainer">
    <!-- Dynamisch opgebouwd -->
  </main>

  <!-- FOOTER -->
  <footer class="border-t border-black py-8 px-6 md:px-12 mt-20">
    <div class="max-w-6xl mx-auto flex justify-between items-center text-xs uppercase tracking-widest text-neutral-500 font-medium">
      <span>Bjorn van Es</span>
      <span>&copy; All rights reserved</span>
    </div>
  </footer>

  <!-- SCRIPT & DATA -->
  <script>
    // ==========================================
    // SPECTRUM ORDER: RED -> ORANGE -> YELLOW -> GREEN -> BLUE -> BLACK
    // Pas hier per foto 'src' en 'subject' aan
    // ==========================================
    const categoryData = [
      {
        id: 'red',
        title: '01. Red',
        photos: [
          {
            src: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1600&q=80',
            subject: 'Autumn Foliage'
          },
          {
            src: 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1600&q=80',
            subject: 'Urban Neon Light'
          },
          {
            src: 'https://images.unsplash.com/photo-1508739773434-c26b3d09e071?auto=format&fit=crop&w=1600&q=80',
            subject: 'Crimson Dunes'
          }
        ]
      },
      {
        id: 'orange',
        title: '02. Orange',
        photos: [
          {
            src: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80',
            subject: 'Golden Hour Peak'
          },
          {
            src: 'https://images.unsplash.com/photo-1470240731273-7821a6eeb6bd?auto=format&fit=crop&w=1600&q=80',
            subject: 'Sunset Valley'
          },
          {
            src: 'https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=1600&q=80',
            subject: 'Desert Canyon Warmth'
          }
        ]
      },
      {
        id: 'yellow',
        title: '03. Yellow',
        photos: [
          {
            src: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1600&q=80',
            subject: 'First Ridge Light'
          },
          {
            src: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=1600&q=80',
            subject: 'Autumn Aspens'
          },
          {
            src: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=1600&q=80',
            subject: 'Morning Bloom'
          }
        ]
      },
      {
        id: 'green',
        title: '04. Green',
        photos: [
          {
            src: 'https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1600&q=80',
            subject: 'Pine Forest Mist'
          },
          {
            src: 'https://images.unsplash.com/photo-1511497584788-87676104235f?auto=format&fit=crop&w=1600&q=80',
            subject: 'Morning Canopy'
          },
          {
            src: 'https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=1600&q=80',
            subject: 'Fern Valley'
          }
        ]
      },
      {
        id: 'blue',
        title: '05. Blue',
        photos: [
          {
            src: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80',
            subject: 'Alpine Lake Basin'
          },
          {
            src: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80',
            subject: 'Coastal Horizon'
          },
          {
            src: 'https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1600&q=80',
            subject: 'Deep Water Reflections'
          }
        ]
      },
      {
        id: 'black',
        title: '06. Black',
        photos: [
          {
            src: 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1600&q=80',
            subject: 'Monochrome Facade'
          },
          {
            src: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1600&q=80',
            subject: 'Studio Silhouette'
          },
          {
            src: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=1600&q=80',
            subject: 'Night City Geometry'
          }
        ]
      }
    ];

    const activeIndices = {};

    function initPage() {
      const navContainer = document.getElementById('categoryNav');
      const mainContainer = document.getElementById('portfolioContainer');

      categoryData.forEach((section) => {
        activeIndices[section.id] = 0;

        // Sticky navigatielink
        const navItem = document.createElement('a');
        navItem.href = `#${section.id}`;
        navItem.className = 'text-xs uppercase tracking-widest font-medium whitespace-nowrap text-neutral-500 hover:text-black transition-colors';
        navItem.innerText = section.title;
        navContainer.appendChild(navItem);

        // Sectie container
        const sectionEl = document.createElement('section');
        sectionEl.id = section.id;
        sectionEl.className = 'scroll-mt-28 space-y-4';

        sectionEl.innerHTML = `
          <div class="border-b border-black pb-2 flex justify-between items-baseline">
            <h2 class="text-sm uppercase tracking-widest font-bold">${section.title}</h2>
            <span class="text-xs uppercase tracking-widest text-neutral-400 font-medium" id="counter-${section.id}">
              1 / ${section.photos.length}
            </span>
          </div>

          <div class="relative bg-neutral-100 aspect-[16/10] overflow-hidden select-none">
            <img 
              id="main-img-${section.id}" 
              src="${section.photos[0].src}" 
              alt="${section.photos[0].subject}" 
              class="w-full h-full object-cover transition-opacity duration-300"
            />

            <button 
              onclick="changePhoto('${section.id}', -1)" 
              class="absolute left-4 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/80 hover:bg-black hover:text-white flex items-center justify-center transition-all duration-200"
              aria-label="Previous photo"
            >
              &#8592;
            </button>
            <button 
              onclick="changePhoto('${section.id}', 1)" 
              class="absolute right-4 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/80 hover:bg-black hover:text-white flex items-center justify-center transition-all duration-200"
              aria-label="Next photo"
            >
              &#8594;
            </button>
          </div>

          <!-- Onderwerp per foto -->
          <div class="flex justify-between items-center text-xs uppercase tracking-wider text-neutral-600 font-medium py-1">
            <span id="subject-${section.id}">
              ${section.photos[0].subject}
            </span>
          </div>

          <!-- Thumbnails -->
          <div class="flex gap-2 overflow-x-auto no-scrollbar pt-2" id="thumbs-${section.id}">
            ${section.photos.map((photo, pIndex) => `
              <button 
                onclick="setPhoto('${section.id}', ${pIndex})"
                class="flex-shrink-0 w-20 sm:w-24 aspect-[16/10] overflow-hidden border ${pIndex === 0 ? 'border-black opacity-100' : 'border-transparent opacity-40'} hover:opacity-100 transition-all duration-200"
                id="thumb-${section.id}-${pIndex}"
                aria-label="${photo.subject}"
              >
                <img src="${photo.src}" class="w-full h-full object-cover" />
              </button>
            `).join('')}
          </div>
        `;

        mainContainer.appendChild(sectionEl);
      });
    }

    function changePhoto(sectionId, direction) {
      const section = categoryData.find(s => s.id === sectionId);
      let newIndex = activeIndices[sectionId] + direction;

      if (newIndex < 0) {
        newIndex = section.photos.length - 1;
      } else if (newIndex >= section.photos.length) {
        newIndex = 0;
      }

      setPhoto(sectionId, newIndex);
    }

    function setPhoto(sectionId, index) {
      const section = categoryData.find(s => s.id === sectionId);
      activeIndices[sectionId] = index;
      const photo = section.photos[index];

      const imgEl = document.getElementById(`main-img-${sectionId}`);
      imgEl.style.opacity = '0.3';
      setTimeout(() => {
        imgEl.src = photo.src;
        imgEl.alt = photo.subject;
        imgEl.style.opacity = '1';
      }, 150);

      document.getElementById(`subject-${sectionId}`).innerText = photo.subject;
      document.getElementById(`counter-${sectionId}`).innerText = `${index + 1} / ${section.photos.length}`;

      section.photos.forEach((_, pIndex) => {
        const thumb = document.getElementById(`thumb-${sectionId}-${pIndex}`);
        if (pIndex === index) {
          thumb.className = 'flex-shrink-0 w-20 sm:w-24 aspect-[16/10] overflow-hidden border border-black opacity-100 transition-all duration-200';
        } else {
          thumb.className = 'flex-shrink-0 w-20 sm:w-24 aspect-[16/10] overflow-hidden border border-transparent opacity-40 hover:opacity-100 transition-all duration-200';
        }
      });
    }

    window.onload = initPage;
  </script>
</body>
</html>
