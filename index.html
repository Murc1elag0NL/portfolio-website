<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bjorn van Es</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            pureBlack: '#000000',
            pureWhite: '#ffffff',
          }
        }
      }
    }
  </script>

  <style>
    html, body {
      overflow-anchor: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #ffffff;
      color: #000000;
      -webkit-font-smoothing: antialiased;
      overflow-y: scroll;
    }

    #heroStage {
      height: 46vh;
      min-height: 300px;
      max-height: 520px;
    }

    @media (min-width: 768px) {
      #heroStage {
        height: 54vh;
        min-height: 400px;
        max-height: 620px;
      }
    }

    .thumb-btn img {
      transition: filter 160ms ease, opacity 160ms ease;
    }

    .thumb-btn:hover img,
    .thumb-btn.is-active img {
      filter: grayscale(0%);
      opacity: 1;
    }

    .thumb-btn:not(.is-active) img {
      filter: grayscale(100%);
      opacity: 0.55;
    }

    .thumb-btn:not(.is-active):hover img {
      filter: grayscale(0%);
      opacity: 1;
    }
  </style>
</head>
<body class="bg-pureWhite text-pureBlack selection:bg-pureBlack selection:text-pureWhite min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="pt-7 pb-4 px-6 md:px-12 shrink-0">
    <div class="max-w-6xl mx-auto text-center">
      <h1 class="text-2xl md:text-4xl font-bold tracking-tight uppercase">
        Bjorn van Es
      </h1>
    </div>
  </header>

  <!-- HOOFDPODIUM & 54-FOTO CONTACTSHEET -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-6 md:px-12 pb-24 flex flex-col gap-6">

    <!-- STICKY GROTE HERO WEERGAVE (Klikken op de foto doet niets) -->
    <section
      aria-label="Geselecteerde foto"
      class="sticky top-0 z-20 bg-pureWhite pt-2 pb-3 w-full flex flex-col items-center shrink-0"
    >
      <div
        id="heroStage"
        class="relative w-full flex items-center justify-center bg-pureWhite select-none touch-pan-y overflow-hidden"
      >
        <!-- Vorige foto knop -->
        <button
          id="heroPrevBtn"
          type="button"
          aria-label="Vorige foto"
          class="absolute left-1 md:left-2 z-10 w-10 h-10 md:w-11 md:h-11 flex items-center justify-center bg-pureWhite/85 text-pureBlack border border-black/15 hover:bg-pureBlack hover:text-pureWhite active:bg-pureBlack active:text-pureWhite transition-colors cursor-pointer"
        >
          <svg class="w-4 h-4 md:w-5 md:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>

        <img
          id="heroImage"
          src="fotos/01.jpg"
          alt="Bjorn van Es - Tsitsikamma NP"
          decoding="async"
          fetchpriority="high"
          class="w-full h-full object-contain px-11 md:px-14"
        />

        <!-- Volgende foto knop -->
        <button
          id="heroNextBtn"
          type="button"
          aria-label="Volgende foto"
          class="absolute right-1 md:right-2 z-10 w-10 h-10 md:w-11 md:h-11 flex items-center justify-center bg-pureWhite/85 text-pureBlack border border-black/15 hover:bg-pureBlack hover:text-pureWhite active:bg-pureBlack active:text-pureWhite transition-colors cursor-pointer"
        >
          <svg class="w-4 h-4 md:w-5 md:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square">
            <path d="M9 18l6-6-6-6" />
          </svg>
        </button>
      </div>

      <!-- TITEL & TELLER -->
      <div class="w-full max-w-3xl h-6 flex items-center justify-between pt-3 px-1 text-xs uppercase tracking-widest text-neutral-500 font-medium shrink-0">
        <span id="heroTitle" class="truncate pr-4 text-pureBlack">Tsitsikamma NP</span>
        <span id="heroCounter" class="tabular-nums shrink-0 text-neutral-400">01 / 54</span>
      </div>
    </section>

    <!-- 54 MINIATUREN -->
    <section aria-label="Fotoselectie" class="relative z-10 w-full pt-1 pb-12 shrink-0">
      <div
        id="thumbnailGrid"
        class="flex flex-wrap justify-center gap-2 md:gap-2.5"
      ></div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="py-8 px-6 md:px-12 shrink-0">
    <div class="max-w-6xl mx-auto flex justify-between items-center text-[11px] uppercase tracking-widest text-neutral-400 font-medium">
      <span>Bjorn van Es</span>
      <span>&copy; All rights reserved</span>
    </div>
  </footer>

  <!-- SCRIPT -->
  <script>
    const TOTAL_PHOTOS = 54;
    const EXT = 'jpg';

    const photoTitles = [
      "Tsitsikamma NP",             // 01
      "Madeira",                    // 02
      "Madeira",                    // 03
      "Karpathos",                  // 04
      "Ko Panyi",                   // 05
      "Phi Phi Islands",            // 06
      "Ama Dablam",                 // 07
      "Lukla airport",              // 08
      "Everest basecamp",           // 09
      "Tioga Road",                 // 10
      "Madeira",                    // 11
      "Kijkduin",                   // 12
      "Valley of Fire SP",          // 13
      "Bryce Canyon NP",            // 14
      "Grand Canyon NP",            // 15
      "Valley of Fire SP",          // 16
      "Secnic Byway 12",            // 17
      "Antelope Canyon",            // 18
      "Atelope Canyon",             // 19
      "Black howler monkey",        // 20
      "Turfmarkt",                  // 21
      "Robben Island",              // 22
      "St. Peter's Basilica",       // 23
      "Osaka",                      // 24
      "Circuit park Zandvoort",     // 25
      "Mclaren P1",                 // 26
      "Ko Panyi",                   // 27
      "Oakland Bay Bridge",         // 28
      "Normandy American Cemetery", // 29
      "Madeira",                    // 30
      "Moon",                       // 31
      "Kijkduin",                   // 32
      "North sea",                  // 33
      "Zandmotor",                  // 34
      "Kiter",                      // 35
      "Moon eclipse",               // 36
      "Full moon",                  // 37
      "Kinderdijk",                 // 38
      "Kruger NP",                  // 39
      "Kiter",                      // 40
      "Kijkduin",                   // 41
      "Hollywood",                  // 42
      "Sunset",                     // 43
      "Sunset",                     // 44
      "Sunset",                     // 45
      "Sunset",                     // 46
      "Rotterdam Harbour",          // 47
      "Fish boat",                  // 48
      "Sunset",                     // 49
      "Rotterdam Harbour",          // 50
      "Sunset",                     // 51
      "Clouds",                     // 52
      "Noctilucent clouds",         // 53
      "Sun eclips"                  // 54
    ];

    const photos = Array.from({ length: TOTAL_PHOTOS }, (_, i) => {
      const num = String(i + 1).padStart(2, '0');
      return {
        src: `fotos/${num}.${EXT}`,
        title: photoTitles[i] || ''
      };
    });

    let currentIndex = 0;
    let activeRequestId = 0;
    let isScrolling = false;
    let scrollTimer = null;
    const preloadedCache = new Set();

    const heroStage = document.getElementById('heroStage');
    const heroImage = document.getElementById('heroImage');
    const heroTitle = document.getElementById('heroTitle');
    const heroCounter = document.getElementById('heroCounter');
    const heroPrevBtn = document.getElementById('heroPrevBtn');
    const heroNextBtn = document.getElementById('heroNextBtn');
    const thumbnailGrid = document.getElementById('thumbnailGrid');

    window.addEventListener('scroll', () => {
      isScrolling = true;
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => {
        isScrolling = false;
      }, 150);
    }, { passive: true });

    function optimizeThumbWithCanvas(imgElement) {
      if (!imgElement.complete || imgElement.naturalWidth === 0 || imgElement.dataset.optimized === 'true') {
        return;
      }
      try {
        const canvas = document.createElement('canvas');
        const targetW = 240;
        const targetH = 180;
        canvas.width = targetW;
        canvas.height = targetH;
        const ctx = canvas.getContext('2d');

        const imgRatio = imgElement.naturalWidth / imgElement.naturalHeight;
        const targetRatio = targetW / targetH;
        let drawW, drawH, offsetX, offsetY;

        if (imgRatio > targetRatio) {
          drawH = imgElement.naturalHeight;
          drawW = imgElement.naturalHeight * targetRatio;
          offsetX = (imgElement.naturalWidth - drawW) / 2;
          offsetY = 0;
        } else {
          drawW = imgElement.naturalWidth;
          drawH = imgElement.naturalWidth / targetRatio;
          offsetX = 0;
          offsetY = (imgElement.naturalHeight - drawH) / 2;
        }

        ctx.drawImage(imgElement, offsetX, offsetY, drawW, drawH, 0, 0, targetW, targetH);
        imgElement.src = canvas.toDataURL('image/jpeg', 0.72);
        imgElement.dataset.optimized = 'true';
      } catch (e) {
        // Laat originele src staan als canvas niet beschikbaar is
      }
    }

    function preloadImage(index) {
      const wrappedIndex = (index + photos.length) % photos.length;
      const src = photos[wrappedIndex].src;
      if (!preloadedCache.has(src)) {
        const img = new Image();
        img.decoding = 'async';
        img.src = src;
        preloadedCache.add(src);
      }
    }

    function updateUrlHash(index) {
      const targetHash = `#${index + 1}`;
      if (window.location.hash !== targetHash) {
        history.replaceState(null, '', targetHash);
      }
    }

    function selectPhoto(index, updateHash = false) {
      const wrappedIndex = (index + photos.length) % photos.length;
      if (wrappedIndex === currentIndex && heroImage.dataset.loaded === 'true') {
        return;
      }

      currentIndex = wrappedIndex;
      const requestId = ++activeRequestId;
      const photo = photos[currentIndex];
      const formattedNum = String(currentIndex + 1).padStart(2, '0');

      heroTitle.textContent = photo.title;
      heroCounter.textContent = `${formattedNum} / ${String(photos.length).padStart(2, '0')}`;

      const buttons = thumbnailGrid.querySelectorAll('.thumb-btn');
      buttons.forEach((btn, idx) => {
        if (idx === currentIndex) {
          btn.classList.add('is-active', 'ring-1', 'ring-black', 'ring-offset-2');
          btn.setAttribute('aria-current', 'true');
        } else {
          btn.classList.remove('is-active', 'ring-1', 'ring-black', 'ring-offset-2');
          btn.removeAttribute('aria-current');
        }
      });

      const loader = new Image();
      loader.decoding = 'async';
      loader.src = photo.src;
      loader.onload = () => {
        if (requestId !== activeRequestId) return;
        heroImage.src = photo.src;
        heroImage.alt = photo.title ? `Bjorn van Es - ${photo.title}` : `Bjorn van Es - ${formattedNum}`;
        heroImage.dataset.loaded = 'true';
      };

      if (updateHash) {
        updateUrlHash(currentIndex);
      }

      preloadImage(currentIndex + 1);
      preloadImage(currentIndex - 1);
    }

    function attachSwipeNavigation(element) {
      let touchStartX = 0;
      let touchStartY = 0;

      element.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      element.addEventListener('touchend', (e) => {
        const deltaX = e.changedTouches[0].screenX - touchStartX;
        const deltaY = e.changedTouches[0].screenY - touchStartY;

        if (Math.abs(deltaX) > 45 && Math.abs(deltaX) > Math.abs(deltaY)) {
          if (deltaX < 0) {
            selectPhoto(currentIndex + 1, true);
          } else {
            selectPhoto(currentIndex - 1, true);
          }
        }
      }, { passive: true });
    }

    function initGallery() {
      photos.forEach((photo, index) => {
        const num = String(index + 1).padStart(2, '0');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'thumb-btn aspect-[4/3] w-[calc(20%-0.4rem)] sm:w-[calc(16.666%-0.521rem)] lg:w-[calc(10%-0.5625rem)] overflow-hidden bg-neutral-100 focus:outline-none cursor-pointer';
        btn.setAttribute('aria-label', photo.title ? `${num} - ${photo.title}` : `Foto ${num}`);

        const img = document.createElement('img');
        img.src = photo.src;
        img.alt = photo.title || `Foto ${num}`;
        img.loading = index < 15 ? 'eager' : 'lazy';
        img.decoding = 'async';
        img.className = 'w-full h-full object-cover';
        img.addEventListener('load', () => optimizeThumbWithCanvas(img), { once: true });

        btn.appendChild(img);

        btn.addEventListener('pointermove', (e) => {
          if (e.pointerType === 'mouse' && !isScrolling) {
            selectPhoto(index, false);
          }
        });
        btn.addEventListener('click', () => selectPhoto(index, true));

        thumbnailGrid.appendChild(btn);
      });

      const hashNumber = parseInt(window.location.hash.replace('#', ''), 10);
      const initialIndex = (!isNaN(hashNumber) && hashNumber >= 1 && hashNumber <= photos.length)
        ? hashNumber - 1
        : 0;

      selectPhoto(initialIndex, false);

      heroPrevBtn.addEventListener('click', () => selectPhoto(currentIndex - 1, true));
      heroNextBtn.addEventListener('click', () => selectPhoto(currentIndex + 1, true));

      attachSwipeNavigation(heroStage);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          selectPhoto(currentIndex + 1, true);
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          selectPhoto(currentIndex - 1, true);
        }
      });

      window.addEventListener('hashchange', () => {
        const num = parseInt(window.location.hash.replace('#', ''), 10);
        if (!isNaN(num) && num >= 1 && num <= photos.length) {
          selectPhoto(num - 1, false);
        }
      });
    }

    window.addEventListener('DOMContentLoaded', initGallery);
  </script>
</body>
</html>
