<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bjorn van Es</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            pureBlack: '#000000',
            pureWhite: '#ffffff',
          }
        }
      }
    }
  </script>

  <style>
    html, body {
      overflow-anchor: none; /* Voorkomt dat Chrome/Edge de scrollpositie laat verspringen */
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #ffffff;
      color: #000000;
      -webkit-font-smoothing: antialiased;
      overflow-y: scroll;
    }

    #heroStage {
      height: 52vh;
      min-height: 360px;
      max-height: 620px;
    }

    @media (min-width: 768px) {
      #heroStage {
        height: 60vh;
        min-height: 460px;
        max-height: 720px;
      }
    }

    .thumb-btn img {
      transition: filter 160ms ease, opacity 160ms ease;
    }

    .thumb-btn:hover img,
    .thumb-btn.is-active img {
      filter: grayscale(0%);
      opacity: 1;
    }

    .thumb-btn:not(.is-active) img {
      filter: grayscale(100%);
      opacity: 0.55;
    }

    .thumb-btn:not(.is-active):hover img {
      filter: grayscale(0%);
      opacity: 1;
    }
  </style>
</head>
<body class="bg-pureWhite text-pureBlack selection:bg-pureBlack selection:text-pureWhite min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="pt-8 pb-5 px-6 md:px-12 shrink-0">
    <div class="max-w-6xl mx-auto text-center">
      <h1 class="text-2xl md:text-4xl font-bold tracking-tight uppercase">
        Bjorn van Es
      </h1>
    </div>
  </header>

  <!-- HOOFDPODIUM & 54-FOTO CONTACTSHEET -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-6 md:px-12 pb-16 flex flex-col gap-8">

    <!-- GROTE HERO WEERGAVE -->
    <section aria-label="Geselecteerde foto" class="w-full flex flex-col items-center shrink-0">
      <div
        id="heroStage"
        class="w-full flex items-center justify-center bg-pureWhite cursor-zoom-in select-none touch-pan-y overflow-hidden"
        title="Klik voor volledig scherm"
      >
        <img
          id="heroImage"
          src="fotos/01.jpg"
          alt="Bjorn van Es - 01"
          decoding="async"
          fetchpriority="high"
          class="w-full h-full object-contain"
        />
      </div>

      <!-- TELLER -->
      <div class="w-full max-w-3xl h-6 flex items-center justify-between pt-3 px-1 text-xs uppercase tracking-widest text-neutral-500 font-medium shrink-0">
        <span id="heroTitle" class="truncate pr-4"></span>
        <span id="heroCounter" class="tabular-nums shrink-0 text-neutral-400">01 / 54</span>
      </div>
    </section>

    <!-- 54 MINIATUREN -->
    <section aria-label="Fotoselectie" class="w-full pt-1 shrink-0">
      <div
        id="thumbnailGrid"
        class="flex flex-wrap justify-center gap-2 md:gap-2.5"
      ></div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="py-8 px-6 md:px-12 shrink-0">
    <div class="max-w-6xl mx-auto flex justify-between items-center text-[11px] uppercase tracking-widest text-neutral-400 font-medium">
      <span>Bjorn van Es</span>
      <span>&copy; All rights reserved</span>
    </div>
  </footer>

  <!-- FULLSCREEN LIGHTBOX -->
  <div
    id="lightbox"
    class="fixed inset-0 z-50 bg-pureWhite hidden items-center justify-center p-4 md:p-10 cursor-zoom-out select-none touch-pan-y"
    aria-hidden="true"
  >
    <img
      id="lightboxImage"
      src=""
      alt="Volledig scherm"
      decoding="async"
      class="max-h-full max-w-full w-auto h-auto object-contain"
    />
  </div>

  <!-- SCRIPT -->
  <script>
    const TOTAL_PHOTOS = 54;
    const EXT = 'jpg';

    const photos = Array.from({ length: TOTAL_PHOTOS }, (_, i) => {
      const num = String(i + 1).padStart(2, '0');
      return {
        src: `fotos/${num}.${EXT}`,
        title: ''
      };
    });

    let currentIndex = 0;
    let activeRequestId = 0;
    let isScrolling = false;
    let scrollTimer = null;
    const preloadedCache = new Set();

    const heroStage = document.getElementById('heroStage');
    const heroImage = document.getElementById('heroImage');
    const heroTitle = document.getElementById('heroTitle');
    const heroCounter = document.getElementById('heroCounter');
    const thumbnailGrid = document.getElementById('thumbnailGrid');
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');

    // Pauzeer
